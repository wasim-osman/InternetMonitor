[package]
name = "internet-monitor"
version = "1.1.1"
description = "Internet Monitor — dashboard and controller for imonitord agents"
authors = ["Wasim Osman"]
license = "MIT"
repository = "https://github.com/wasim-osman/InternetMonitor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "internet_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
if-addrs = "0.13"
dns-lookup = "2"
socket2 = { version = "0.5", features = ["all"] }
gethostname = "0.5"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
