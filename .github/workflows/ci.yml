name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod }
      - run: cd agent && go vet ./... && go test ./...
      - run: cd agent && make release
  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cd app && swift test
